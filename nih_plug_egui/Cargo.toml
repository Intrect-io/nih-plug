[package]
name = "nih_plug_egui"
version = "0.0.0"
edition = "2021"
authors = ["Robbert van der Helm <mail@robbertvanderhelm.nl>"]
license = "ISC"

description = "An adapter to use egui GUIs with NIH-plug"

[features]
default = ["opengl", "default_fonts"]
# Upstream defaults to OpenGL because egui's wgpu backend was still unstable. On macOS that
# means running on the deprecated OpenGL-on-Metal shim, which costs real CPU per frame
# (`AppleMetalOpenGLRenderer` was 35% of the GUI thread in enzyme's profile, AUD-661), so
# `wgpu` is exposed here as an opt-in native-Metal path.
#
# Cargo unions features, so a graph where one crate wants `opengl` and another wants `wgpu`
# ends up with both. Our egui-baseview fork gives `wgpu` precedence in that case rather than
# failing to build; the `not(wgpu)` guards below keep this crate consistent with that.
opengl = ["egui-baseview/opengl"]
wgpu = ["egui-baseview/wgpu"]
default_fonts = ["egui-baseview/default_fonts"]
rayon = ["egui-baseview/rayon"]

[dependencies]
nih_plug = { path = "..", default-features = false }
raw-window-handle = "0.5"
baseview = { git = "https://github.com/RustAudio/baseview.git", rev = "9a0b42c09d712777b2edb4c5e0cb6baf21e988f0" }
crossbeam = "0.8"
egui-baseview = { git = "https://github.com/BillyDM/egui-baseview.git", rev = "ec70c3fe6b2f070dcacbc22924431edbe24bd1c0" }
parking_lot = "0.12"
# To make the state persistable
serde = { version = "1.0", features = ["derive"] }
